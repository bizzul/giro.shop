minimumReleaseAgeExclude:
  - '@astrojs/internal-helpers@0.13.1'
  - '@astrojs/markdown-satteri@0.4.7'
  - astro@7.4.7
  - '@astrojs/node@11.1.11'
  - '@astrojs/preact@6.1.2'
  - preact@11.2.0

# Script di installazione non necessari: onnxruntime-node ha già i binari per CPU (lo script aggiunge solo CUDA su Linux)
allowBuilds:
  onnxruntime-node: false
  protobufjs: false
  # La CLI di Supabase (versione fissa, uguale su ogni computer) scarica il suo programma all'installazione
  supabase: true
